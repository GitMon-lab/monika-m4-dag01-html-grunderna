<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Document</title>
        <style>
            /*1fr 2fr- en del, den andra dubbelts så bred
                        auto 1fr
                        minmax(200px, 1 fr) Minst 200 men högst 1fr
                        repeat(2, 1fr) 2 kolumner a 1fr eller tänka  2 * 1fr
            auto-fit: tomma kolumner kollapsar, reserande children fyller ut, vanligast
            auto-fill tomma kolumner visas, children behåller storlek, tomt utrymme visas

                        responsiv sida
                        display:grid; grid-template-columns: repeat(auto-fit,minmax(240px,1fr)); gap 20px;

                        Låt radhöjd följa innehåll, sätt ej fast höjd
                         grid-template-columns: 1fr 2fr 1f
                         grid-auto.rows:minmax(100px, auto);

                         grid-column:span2 tar 2 kolumner använd för rubriker
                         grid-column: 1/-1; hela raden
                        */

            .kort {
                display: grid;
                grid-template-columns: 1fr 1fr;

                /* grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));*/
                column-gap: 8px;
                row-gap: 8px;

                /*   grid-rows: auto, auto;
                            grid-columns: 100px, auto, 100px;*/
            }

            .ruta {
                border: solid grey 2px;
                background-color: brown;
                font-size: 32px;
                padding: 16px;
            }

            .ruta1 {
                /*  grid-row: 1; */
                grid-column: 1/-1;
                background-color: rgb(238, 238, 20);
            }
            .ruta2 {
                /*    grid-row: 2/3 span2; */
                grid-column: 1/2;
                background-color: blueviolet;
            }
            .ruta3 {
                /*   grid-column: 3/4; */
                grid-row: span 2;
                background-color: rgb(43, 226, 64);
            }
        </style>
    </head>
    <body>
        <section class="kort">
            <div class="ruta ruta1">1</div>
            <div class="ruta ruta2">2</div>
            <div class="ruta ruta3">3</div>
            <div class="ruta ruta4">4</div>
            <div class="ruta ruta5">5</div>
        </section>
    </body>
</html>
